name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS 앱
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # macOS 26 SDK 로 빌드해야 리퀴드 글래스 API 를 쓸 수 있다 (macOS 13~15 에서는 직접 그린 유리로 동작)
      - name: Xcode 26 고르기
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      - name: Swift 버전
        run: swift --version
      - name: 핵심 로직 테스트
        working-directory: mac
        run: swift test
      - name: 일해라.app 빌드
        working-directory: mac
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="1.2.1"; fi
          VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Ilhaera-mac
          path: mac/build/Ilhaera-mac.zip

  windows:
    name: Windows exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 핵심 로직 테스트
        run: dotnet run -c Release --project windows/tests/CoreTests.csproj
      - name: TodoWidget.exe 빌드
        run: dotnet build -c Release windows/src/TodoWidget.csproj -o out
      - uses: actions/upload-artifact@v4
        with:
          name: TodoWidget-windows
          path: out/TodoWidget.exe

  release:
    name: 릴리스
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Ilhaera-mac/Ilhaera-mac.zip \
            dist/TodoWidget-windows/TodoWidget.exe \
            --repo "$GITHUB_REPOSITORY" --title "일해라 $GITHUB_REF_NAME" \
            --notes "Mac: Ilhaera-mac.zip (macOS 13 이상, Apple 실리콘·인텔) / Windows: TodoWidget.exe (Windows 10·11)"
