name: screenshots

# Mac 앱을 실제로 띄워 화면을 찍는다 (PR 과 수동 실행).
on:
  pull_request:
    paths: ["mac/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 고르기
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          sw_vers
          defaults read com.apple.universalaccess reduceTransparency || true
      - name: 일해라.app 빌드
        working-directory: mac
        run: ./build-app.sh
      - name: Xcode 목록
        run: ls /Applications | grep -i xcode || true
      - name: 실행하고 찍기
        run: |
          mkdir -p shots
          shoot() {  # shoot <이름> <테마> [앱 인자...]
            local name="$1" theme="$2"; shift 2
            python3 mac/ci/seed.py "$theme"
            open "mac/build/일해라.app" --args "$@"
            sleep 10
            screencapture -x "shots/$name.png"
            pkill -x Ilhaera || true
            sleep 2
          }
          shoot light light
          shoot dark dark
          # 유리 뒤로 비칠 그림을 먼저 띄운다
          open -a Preview mac/ci/backdrop.png
          sleep 5
          shoot glass glass
          shoot glass-noblur glass --no-blur
          shoot settings glass --settings
          ls -la shots
      # 결과를 ci-output-<OS> 브랜치에 올린다 (artifact 를 받을 수 없는 환경에서도 git 으로 가져갈 수 있게)
      - name: ci-output 브랜치에 올리기
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp shots/*.png out/
          cp mac/build/Ilhaera-mac.zip out/
          cd out
          git init -q -b "ci-output-${{ matrix.os }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-output-${{ matrix.os }}"
